<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Frog Built | Coming Soon</title>
  <meta name="description" content="Black Frog Built - Custom software and AI integration. Leap Ahead.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23030712' width='32' height='32' rx='6'/><text x='16' y='22' font-family='monospace' font-size='14' fill='%23A3E635' text-anchor='middle'>$</text></svg>">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
    
    :root {
      --dark: #030712;
      --lime: #A3E635;
      --white: #F3F4F6;
      --gray: #6B7280;
      --gray-dark: #374151;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    
    body {
      font-family: 'JetBrains Mono', Consolas, Monaco, 'Courier New', monospace;
      background-color: var(--dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* ========== INTRO TERMINAL ========== */
    .intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--dark);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 2rem;
      padding-top: 3rem;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    
    .intro.fade-out {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
    
    .intro-line {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      opacity: 0;
    }
    
    .intro-line.visible { opacity: 1; }
    
    .intro-prompt { color: var(--lime); }
    .intro-path { color: var(--gray); }
    .intro-typed { color: var(--white); }
    
    .intro-cursor {
      width: 45px;
      height: 50px;
      margin-left: 0;
      animation: blink 1s step-end infinite;
      display: inline-block;
      vertical-align: middle;
    }
    
    .intro-cursor img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: invert(1);
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    
    .intro-output {
      color: var(--gray);
      padding-left: 1.5rem;
      font-size: 0.9rem;
      opacity: 0;
    }
    
    .intro-output.visible { opacity: 1; }
    
    .intro-success {
      color: var(--lime);
      padding-left: 1.5rem;
      font-size: 0.9rem;
      opacity: 0;
    }
    
    .intro-success.visible { opacity: 1; }
    
    .progress-container {
      margin-top: 1.5rem;
      margin-left: 1.5rem;
      width: 300px;
      opacity: 0;
    }
    
    .progress-container.visible { opacity: 1; }
    
    .progress-bar {
      height: 4px;
      background: var(--gray-dark);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--lime);
      transition: width 0.1s linear;
    }
    
    .progress-text {
      font-size: 0.75rem;
      color: var(--gray);
      margin-top: 0.5rem;
    }
    
    /* ========== MAIN PAGE ========== */
    .main-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    
    .main-page.visible { opacity: 1; }
    
    .grid-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(163, 230, 53, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(163, 230, 53, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }
    
    .glow {
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(163, 230, 53, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 10s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }
    
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    
    .frog-container { margin-bottom: 2.5rem; }
    
    .frog-logo {
      width: 280px;
      height: auto;
      filter: invert(1);
      opacity: 0.95;
    }
    
    .logo { text-align: center; margin-bottom: 3rem; }
    
    .logo-text {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-size: 2.25rem;
      font-weight: 500;
    }
    
    .prompt { color: var(--lime); }
    .text-white { color: var(--white); }
    .text-lime { color: var(--lime); }
    .text-gray { color: var(--gray); }
    
    .tagline {
      color: var(--gray);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 1rem;
    }
    
    .terminal {
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--gray-dark);
      border-radius: 8px;
      padding: 1.75rem;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(10px);
    }
    
    .terminal-header {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--gray-dark);
    }
    
    .terminal-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    
    .terminal-dot.red { background: #EF4444; }
    .terminal-dot.yellow { background: #EAB308; }
    .terminal-dot.green { background: var(--lime); }
    
    .terminal-content { font-size: 0.875rem; line-height: 1.9; }
    .terminal-line { margin-bottom: 0.25rem; }
    .terminal-output { color: var(--white); padding-left: 1.25rem; margin-bottom: 1rem; }
    
    .cursor {
      display: inline-block;
      width: 9px; height: 16px;
      background: var(--lime);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }
    
    .contact {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--gray-dark);
    }
    
    .contact-label {
      color: var(--gray);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.6rem;
    }
    
    .contact-link {
      color: var(--lime);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    
    .contact-link:hover { color: var(--white); }
    
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--gray);
      font-size: 0.7rem;
      position: relative;
      z-index: 1;
    }
    
    @media (max-width: 640px) {
      .intro-line { font-size: 0.9rem; }
      .intro-cursor { width: 32px; height: 36px; }
      .logo-text { font-size: 1.5rem; }
      .tagline { font-size: 0.75rem; }
      .terminal { padding: 1.25rem; }
      .frog-logo { width: 200px; }
      .progress-container { width: 200px; }
    }
  </style>
</head>

  <script>
    function typeText(element, text, speed, callback) {
      let i = 0;
      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          setTimeout(type, speed + Math.random() * 40);
        } else if (callback) {
          callback();
        }
      }
      type();
    }
    
    async function runIntro() {
      const line1 = document.getElementById('line1');
      const line2 = document.getElementById('line2');
      const typed1 = document.getElementById('typed1');
      const typed2 = document.getElementById('typed2');
      const cursor1 = document.getElementById('cursor1');
      const cursor2 = document.getElementById('cursor2');
      const output1 = document.getElementById('output1');
      const output2 = document.getElementById('output2');
      const output3 = document.getElementById('output3');
      const progressContainer = document.getElementById('progressContainer');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const successMsg = document.getElementById('successMsg');
      const intro = document.getElementById('intro');
      const mainPage = document.getElementById('mainPage');
      
      // Cursor blinks for 2 seconds before typing starts
      await delay(2000);
      
      // Type the first command
      await new Promise(resolve => {
        typeText(typed1, './launch --init', 55, resolve);
      });
      
      await delay(500);
      cursor1.style.display = 'none';
      
      // Show outputs
      await delay(300);
      output1.textContent = '→ Loading modules...';
      output1.classList.add('visible');
      
      await delay(400);
      output2.textContent = '→ Connecting services...';
      output2.classList.add('visible');
      
      await delay(400);
      output3.textContent = '→ Building interface...';
      output3.classList.add('visible');
      
      // Show progress bar
      await delay(300);
      progressContainer.classList.add('visible');
      
      const steps = [
        { pct: 15, text: 'Compiling assets...' },
        { pct: 35, text: 'Optimizing...' },
        { pct: 55, text: 'Loading components...' },
        { pct: 75, text: 'Almost there...' },
        { pct: 100, text: 'Complete!' }
      ];
      
      for (const step of steps) {
        await delay(350);
        progressFill.style.width = step.pct + '%';
        progressText.textContent = step.text;
      }
      
      // Success message
      await delay(400);
      successMsg.textContent = '✓ Ready. Launching...';
      successMsg.classList.add('visible');
      
      // Transition to main page
      await delay(800);
      intro.classList.add('fade-out');
      mainPage.classList.add('visible');
      
      await delay(900);
      intro.style.display = 'none';
    }
    
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    window.addEventListener('load', runIntro);
  </script>
